<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>400 - Bad Request</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap" rel="stylesheet">

<style>
body{
    margin:0;
    background:#0c0908;
    color:#ff9b42;
    font-family:Orbitron,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:repeating-linear-gradient(
        90deg,
        transparent 0 90px,
        rgba(255,140,0,.05) 90px 91px
    );
}

.box{
    text-align:center;
    animation:glitch .15s infinite alternate;
}

h1{
    font-size:11rem;
    margin:0;
}

p{
    color:#fff;
    font-size:2rem;
}

.leet{
    position:fixed;
    bottom:25px;
    left:50%;
    transform:translateX(-50%);
    color:#00d000;
    font-size:3rem;
    letter-spacing:.35em;
}

@keyframes glitch{
from{transform:translate(-2px,1px);}
to{transform:translate(2px,-1px);}
}
</style>
</head>
<body>

<div class="box">
<h1>400</h1>
<p>BAD REQUEST</p>
</div>

<div class="leet">1337</div>

</body>
</html>
