# ==============================================================================
# SERVER 1: Main Application (Port 8080)
# Purpose: Tests standard routing, file uploads, and CGI.
# ==============================================================================
server {
    listen 8080;
    server_name localhost main_site;
    
    client_max_body_size 5M;
    # error_page 404 /404.html;
    # error_page 500 502 503 504 /50x.html;

    # 1. Standard Root Location
    location / {
        allowed_methods GET;
        root /home/claghrab/Desktop/mini-web/www;
        index index.html default.html;
        autoindex off;
    }

    # location /chaimaa/ {
    #     allowed_methods GET POST DELETE;
    #     alias /home/claghrab/Desktop/mini-web/chaimaa;
    #     upload_dir /home/claghrab/Desktop/mini-web/uploads;
    #     autoindex on;
    # }

    # 2. Upload Directory (Tests POST and DELETE logic)
    location /uploads/ {
        allowed_methods GET POST DELETE;
        root /home/claghrab/Desktop/mini-web;
        upload_dir /home/claghrab/Desktop/mini-web/uploads;
        autoindex on;
    }

    # 3. CGI Execution Directory
    location /cgi-bin/ {
        allowed_methods GET POST;
        root /home/claghrab/Desktop/mini-web;
        index script.php;
    }
}

# ==============================================================================
# SERVER 2: Static Media Server (Port 8081)
# Purpose: Tests alias vs root math and HTTP redirections.
# ==============================================================================
server {
    listen 8081;
    server_name media.local;

    client_max_body_size 10M;

    # 1. Alias Math Test (URI /assets/cat.png -> /mini-web/shared/cat.png)
    location /assets/ {
        allowed_methods GET;
        alias /home/claghrab/Desktop/mini-web/shared/;
        autoindex on;
    }

    # 2. Root Math Test (URI /downloads/file.zip -> /mini-web/downloads/file.zip)
    location /downloads/ {
        allowed_methods GET;
        root /home/claghrab/Desktop/mini-web;
        autoindex on;
    }

    # 3. HTTP Redirect (301 Moved Permanently)
    location /old-media/ {
        allowed_methods GET;
        redirect 301 /assets/;
    }
}

# ==============================================================================
# SERVER 3: API Server (Port 8080 - VIRTUAL HOSTING TEST)
# Purpose: Tests Server Name resolution and Longest Prefix Match traps.
# ==============================================================================
server {
    # TRAP: Shares port 8080 with Server 1! 
    # Router must check the "Host" header to decide between them.
    listen 8080;
    server_name api.local;

    client_max_body_size 1K; # Very small to test 413 Payload Too Large

    # 1. The Broad Match
    location /api/ {
        allowed_methods GET POST DELETE;
        root /home/claghrab/Desktop/mini-web/api_root;
        index status.json;
    }

    # 2. The Longest Prefix Trap (Read-only)
    location /api/public/ {
        allowed_methods GET;
        root /home/claghrab/Desktop/mini-web/api_root/public;
        autoindex off;
    }

    # 3. The Strict Admin Trap (No Deletes allowed)
    location /api/admin/ {
        allowed_methods GET POST;
        root /home/claghrab/Desktop/mini-web/api_root/admin;
        index dashboard.html;
    }
}