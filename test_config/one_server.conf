server {
	listen localhost:8000;
	location /bin/ {
		root /usr/;
		autoindex off;
		allowed_methods GET;
	}
location / {
    allowed_methods GET POST;
    root /;
    alias /images/;
    client_max_body_size 10m;
    upload_dir /var/www/uploads;
}

location /images/uploads/ {
    allowed_methods GET POST;
    root /;
    alias /gallery/;
    # upload_dir /var/www/gallery;
} 
}


