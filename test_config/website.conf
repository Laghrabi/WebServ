types {
    # HTML
    text/html                             html htm shtml;

    # CSS
    text/css                              css;

    # JavaScript
    application/javascript                js mjs;

    # JSON
    application/json                      json;

    # XML
    application/xml                       xml;

    # Plain text
    text/plain                            txt;

    # Images
    image/jpeg                            jpg jpeg;
    image/png                             png;
    image/gif                             gif;
    image/webp                            webp;
    image/svg+xml                         svg svgz;
    image/x-icon                          ico;
    image/bmp                             bmp;
    image/tiff                            tif tiff;
    image/avif                            avif;

    # Fonts
    font/ttf                              ttf;
    font/otf                              otf;
    font/woff                             woff;
    font/woff2                            woff2;
    application/vnd.ms-fontobject         eot;

    # Audio
    audio/mpeg                            mp3;
    audio/ogg                             ogg;
    audio/wav                             wav;
    audio/flac                            flac;

    # Video
    video/mp4                             mp4;
    video/webm                            webm;
    video/ogg                             ogv;
    video/x-msvideo                       avi;
    video/quicktime                       mov;
    video/x-matroska                      mkv;

    # Archives
    application/zip                       zip;
    application/gzip                      gz;
    application/x-tar                     tar;
    application/x-7z-compressed           7z;
    application/x-rar-compressed          rar;

    # PDFs
    application/pdf                       pdf;

    # WebAssembly
    application/wasm                      wasm;

    # Multipart
    multipart/form-data                   form;
}

